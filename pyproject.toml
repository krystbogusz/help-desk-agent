[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citywheels-help-desk"
version = "0.1.0"
description = "Command-line AI help desk agent for the CityWheels bike rental shop"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.45",
    "python-dotenv>=1.0",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
citywheels = "citywheels.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
