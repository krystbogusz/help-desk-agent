# Runs the unit tests on every push to main and on pull requests.
# The tests use a fake model, so no API key is needed. The evaluation is not run here,
# because it calls the real model and uses up its quota.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python that pyproject.toml allows, and the newest one.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: python -m pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest
